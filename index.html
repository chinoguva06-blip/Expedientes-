<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ===================================================================
   CONFIG — pega aquí la URL de tu función (ver guía, paso 2).
   Ejemplo: https://transcribir-kuri.TUCUENTA.workers.dev
   =================================================================== */
const FUNCION_URL = "https://kuriiexpedientes.chinoguva06.workers.dev";

/* ---------- Guardado permanente en el dispositivo (IndexedDB) ---------- */
const DB_NAME = "kuri-expedientes", DB_VER = 1;
let _dbp = null;
function _openDB(){ if(_dbp) return _dbp; _dbp = new Promise((res,rej)=>{ const r = indexedDB.open(DB_NAME, DB_VER); r.onupgradeneeded = ()=>{ const db=r.result; if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv"); if(!db.objectStoreNames.contains("img")) db.createObjectStore("img"); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return _dbp; }
function _idbGet(st,k){ return _openDB().then(db=>new Promise((res,rej)=>{ const t=db.transaction(st,"readonly"); const q=t.objectStore(st).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); })); }
function _idbSet(st,k,v){ return _openDB().then(db=>new Promise((res,rej)=>{ const t=db.transaction(st,"readwrite"); t.objectStore(st).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }
function _idbDel(st,k){ return _openDB().then(db=>new Promise((res,rej)=>{ const t=db.transaction(st,"readwrite"); t.objectStore(st).delete(k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }
const store = {
  async load(){ try{ const v = await _idbGet("kv","data"); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  async save(d){ try{ await _idbSet("kv","data", JSON.stringify(d)); }catch(e){} },
};
const imgStore = {
  async set(id,u){ try{ await _idbSet("img", id, u); }catch(e){} },
  async get(id){ try{ return (await _idbGet("img", id)) || null; }catch(e){ return null; } },
  async del(id){ try{ await _idbDel("img", id); }catch(e){} },
};

/* ---------- Transcripción: la pide a tu función (la llave queda en secreto allá) ---------- */
async function transcribir(dataUrl){
  if(!FUNCION_URL || FUNCION_URL.indexOf("PEGA_AQUI") >= 0) throw new Error("Falta configurar FUNCION_URL");
  const resp = await fetch(FUNCION_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ image: dataUrl }) });
  if(!resp.ok) throw new Error("HTTP " + resp.status);
  const data = await resp.json();
  if(data.error) throw new Error(data.error);
  return (data.text || "").trim();
}



/* =========================================================================
   Dr. Ángel Guzmán Kuri — Expedientes digitales
   Enviar foto de un expediente escrito a mano → se transcribe a texto digital,
   queda guardado de forma permanente y se puede buscar por NOMBRE y FECHA.
   App de un solo archivo.
   ========================================================================= */

const MEDICO = "Dr. Ángel Guzmán Kuri";
const CED_PROF = "2067544";   // Médico general / cédula profesional
const CED_ESP = "3278097";    // Especialista
const CONSEJO = "1504";       // Consejo Mexicano de Oftalmología

/* comprime la foto a JPEG (máx 1500px) para que ocupe poco y se guarde bien */
function leerComprimir(file) {
  return new Promise((res) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1500; let w = img.width, h = img.height;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        try { res(cv.toDataURL("image/jpeg", 0.72)); } catch (e) { res(reader.result); }
      };
      img.onerror = () => res(reader.result);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- utilidades ---------- */
const uid = () => (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hoyISO = () => new Date().toISOString().slice(0, 10);
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const etiquetaMes = (ym) => { if (!ym || ym === "sin") return "Sin fecha"; return (MESES[parseInt(ym.slice(5, 7), 10) - 1] || "") + " " + ym.slice(0, 4); };
const fmtFecha = (iso) => { if (!iso) return ""; const d = new Date(iso + (iso.length <= 10 ? "T00:00:00" : "")); return isNaN(d) ? iso : d.toLocaleDateString("es-MX", { day: "2-digit", month: "long", year: "numeric" }); };
const dataVacia = () => ({ expedientes: [], contador: 1 });

/* ====================================================================== */
function App() {
  const [data, setData] = useState(null);
  const [cargado, setCargado] = useState(false);
  const [vista, setVista] = useState({ name: "lista", id: null });
  const primera = React.useRef(true);

  useEffect(() => { (async () => { const d = await store.load(); setData(d || dataVacia()); setCargado(true); })(); }, []);
  useEffect(() => { if (!cargado || !data) return; if (primera.current) { primera.current = false; return; } store.save(data); }, [data, cargado]);

  if (!cargado || !data) return <div style={{ display: "flex", height: "100vh", alignItems: "center", justifyContent: "center", fontFamily: "system-ui", color: "#16467E" }}>Cargando…</div>;

  const upd = (fn) => setData((d) => { const nd = { ...d }; fn(nd); return nd; });
  const ir = (name, id = null) => { setVista({ name, id }); window.scrollTo(0, 0); };

  const nuevoExpediente = () => {
    const id = uid();
    upd((d) => { d.expedientes.push({ id, num: "EXP-" + String(d.contador).padStart(4, "0"), nombre: "", fecha: hoyISO(), telefono: "", nota: "", manual: {}, hojas: [], fotosPaciente: [], creadoEn: new Date().toISOString() }); d.contador += 1; });
    ir("editor", id);
  };
  const guardarExp = (exp) => upd((d) => { const i = d.expedientes.findIndex((e) => e.id === exp.id); if (i >= 0) d.expedientes[i] = exp; });
  const actualizarHoja = (expId, hojaId, patch) => upd((d) => { const e = d.expedientes.find((x) => x.id === expId); if (!e) return; const h = e.hojas.find((x) => x.id === hojaId); if (h) Object.assign(h, patch); });
  const borrarExp = (id) => upd((d) => { const e = d.expedientes.find((x) => x.id === id); if (e) { (e.hojas || []).forEach((h) => imgStore.del(h.imgId)); (e.fotosPaciente || []).forEach((h) => imgStore.del(h.imgId)); } d.expedientes = d.expedientes.filter((x) => x.id !== id); });

  const ctx = { data, ir, upd, nuevoExpediente, guardarExp, actualizarHoja, borrarExp };

  return (
    <div className="cx-root">
      <style>{CSS}</style>
      <header className="cx-top">
        <div className="cx-brand"><span className="cx-logo">◉</span><div><div className="cx-bt">{MEDICO}</div><div className="cx-bs">Expedientes digitales</div></div></div>
        <button className="cx-btn primary" onClick={nuevoExpediente}>＋ Nuevo expediente</button>
      </header>
      <main className="cx-main">
        {vista.name === "lista" && <Lista ctx={ctx} />}
        {vista.name === "archivo" && <Archivo ctx={ctx} />}
        {vista.name === "editor" && <Editor ctx={ctx} expId={vista.id} />}
      </main>
    </div>
  );
}

/* ---------- pestañas ---------- */
function Tabs({ ctx, actual }) {
  return (
    <div className="cx-tabsbar">
      <button className={"cx-tabbtn" + (actual === "lista" ? " on" : "")} onClick={() => ctx.ir("lista")}>Buscar</button>
      <button className={"cx-tabbtn" + (actual === "archivo" ? " on" : "")} onClick={() => ctx.ir("archivo")}>Por año y mes</button>
    </div>
  );
}

/* ---------- LISTA + BÚSQUEDA por nombre y fecha ---------- */
function Lista({ ctx }) {
  const { data, ir } = ctx;
  const [q, setQ] = useState("");
  const [anio, setAnio] = useState("todos");
  const [mes, setMes] = useState("todos");

  const anios = useMemo(() => Array.from(new Set(data.expedientes.map((e) => (e.fecha || "").slice(0, 4)).filter(Boolean))).sort().reverse(), [data]);

  const lista = useMemo(() => {
    const t = q.toLowerCase().trim();
    return data.expedientes
      .filter((e) => anio === "todos" || (e.fecha || "").slice(0, 4) === anio)
      .filter((e) => mes === "todos" || (e.fecha || "").slice(5, 7) === mes)
      .filter((e) => { if (!t) return true; const txt = (e.nombre || "") + " " + (e.num || "") + " " + e.hojas.map((h) => h.transcripcion || "").join(" "); return txt.toLowerCase().includes(t); })
      .sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  }, [data, q, anio, mes]);

  // agrupar por Año → Mes para organizar
  const grupos = useMemo(() => {
    const g = {};
    lista.forEach((e) => { const k = (e.fecha || "").slice(0, 7) || "sin"; (g[k] = g[k] || []).push(e); });
    return Object.keys(g).sort((a, b) => b.localeCompare(a)).map((k) => ({ k, label: etiquetaMes(k), items: g[k] }));
  }, [lista]);

  return (
    <div className="cx-page">
      <Tabs ctx={ctx} actual="lista" />
      <div className="cx-head"><h1>Expedientes</h1><p className="cx-sub">{lista.length} de {data.expedientes.length}</p></div>

      <div className="cx-search">
        <span className="cx-searchic">⌕</span>
        <input placeholder="Buscar por nombre del paciente…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <div className="cx-filtros">
        <span className="cx-fl">Fecha:</span>
        <select value={anio} onChange={(e) => setAnio(e.target.value)}><option value="todos">Año (todos)</option>{anios.map((a) => <option key={a} value={a}>{a}</option>)}</select>
        <select value={mes} onChange={(e) => setMes(e.target.value)}><option value="todos">Mes (todos)</option>{MESES.map((m, i) => <option key={m} value={String(i + 1).padStart(2, "0")}>{m}</option>)}</select>
        {(anio !== "todos" || mes !== "todos" || q) && <button className="cx-link" onClick={() => { setQ(""); setAnio("todos"); setMes("todos"); }}>limpiar</button>}
      </div>

      {data.expedientes.length === 0 ? (
        <div className="cx-card cx-welcome">
          <div className="cx-welic">📷</div>
          <h2>Empieza tu archivo digital</h2>
          <p>Crea un expediente, escribe el nombre del paciente y la fecha, y sube la foto del expediente hecho a mano. La app lo transcribe a texto digital y lo guarda.</p>
          <button className="cx-btn primary" onClick={ctx.nuevoExpediente}>＋ Nuevo expediente</button>
        </div>
      ) : lista.length === 0 ? (
        <p className="cx-empty cx-card">No se encontraron expedientes con esa búsqueda.</p>
      ) : (
        grupos.map((grp) => (
          <div key={grp.k} className="cx-grupo">
            <div className="cx-grupoh"><span>{grp.label}</span><small>{grp.items.length}</small></div>
            <div className="cx-card cx-listcard">
              {grp.items.map((e) => {
                const snippet = (e.hojas.find((h) => h.transcripcion)?.transcripcion || "").replace(/\n/g, " ").slice(0, 90);
                return (
                  <button key={e.id} className="cx-exprow" onClick={() => ir("editor", e.id)}>
                    <span className="cx-expicon">{e.hojas.length ? "🗎" : "＋"}</span>
                    <span className="cx-expmain">
                      <strong>{e.nombre || "(sin nombre)"}</strong>
                      <small>{fmtFecha(e.fecha)} · {e.hojas.length} {e.hojas.length === 1 ? "hoja" : "hojas"}{snippet ? " · " + snippet + "…" : ""}</small>
                    </span>
                    <span className="cx-arrow">›</span>
                  </button>
                );
              })}
            </div>
          </div>
        ))
      )}
    </div>
  );
}

/* ---------- APARTADO: Archivo por Año → Mes ---------- */
function Archivo({ ctx }) {
  const { data, ir } = ctx;
  const [year, setYear] = useState(null);
  const [month, setMonth] = useState(null);
  const [q, setQ] = useState("");

  const porAnio = {}, porYM = {};
  data.expedientes.forEach((e) => { const f = e.fecha || ""; const y = f.slice(0, 4), ym = f.slice(0, 7); if (y) porAnio[y] = (porAnio[y] || 0) + 1; if (ym) porYM[ym] = (porYM[ym] || 0) + 1; });
  const years = Array.from(new Set([String(new Date().getFullYear()), ...Object.keys(porAnio)])).sort().reverse();

  // Nivel 3: expedientes del mes
  if (year && month) {
    const ym = year + "-" + month;
    const t = q.toLowerCase().trim();
    const items = data.expedientes.filter((e) => (e.fecha || "").slice(0, 7) === ym)
      .filter((e) => !t || ((e.nombre || "") + " " + e.hojas.map((h) => h.transcripcion || "").join(" ")).toLowerCase().includes(t))
      .sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
    return (
      <div className="cx-page">
        <Tabs ctx={ctx} actual="archivo" />
        <div className="cx-bc"><button onClick={() => { setYear(null); setMonth(null); }}>Archivo</button><span>›</span><button onClick={() => setMonth(null)}>{year}</button><span>›</span><b style={{ textTransform: "capitalize" }}>{MESES[parseInt(month, 10) - 1]}</b></div>
        <div className="cx-search"><span className="cx-searchic">⌕</span><input placeholder="Buscar por nombre en este mes…" value={q} onChange={(e) => setQ(e.target.value)} /></div>
        {items.length === 0 ? <p className="cx-empty cx-card">Sin expedientes en este mes.</p> :
          <div className="cx-card cx-listcard">
            {items.map((e) => (
              <button key={e.id} className="cx-exprow" onClick={() => ir("editor", e.id)}>
                <span className="cx-expicon">🗎</span>
                <span className="cx-expmain"><strong>{e.nombre || "(sin nombre)"}</strong><small>{fmtFecha(e.fecha)} · {e.hojas.length} {e.hojas.length === 1 ? "hoja" : "hojas"}</small></span>
                <span className="cx-arrow">›</span>
              </button>
            ))}
          </div>}
      </div>
    );
  }

  // Nivel 2: meses del año
  if (year) {
    return (
      <div className="cx-page">
        <Tabs ctx={ctx} actual="archivo" />
        <div className="cx-bc"><button onClick={() => setYear(null)}>Archivo</button><span>›</span><b>{year}</b></div>
        <div className="cx-folders">
          {MESES.map((m, i) => { const mm = String(i + 1).padStart(2, "0"); const n = porYM[year + "-" + mm] || 0; return (
            <button key={mm} className={"cx-folder" + (n ? "" : " vacia")} onClick={() => setMonth(mm)}>
              <span className="cx-folder-ic">🗂️</span>
              <span className="cx-folder-t">{m}</span>
              <span className="cx-folder-n">{n ? n + (n === 1 ? " expediente" : " expedientes") : "vacío"}</span>
            </button>
          ); })}
        </div>
      </div>
    );
  }

  // Nivel 1: años
  return (
    <div className="cx-page">
      <Tabs ctx={ctx} actual="archivo" />
      <div className="cx-head"><h1>Archivo por año</h1><p className="cx-sub">Organizado por la fecha del expediente</p></div>
      <div className="cx-folders">
        {years.map((y) => (
          <button key={y} className="cx-folder anio" onClick={() => setYear(y)}>
            <span className="cx-folder-ic">📁</span>
            <span className="cx-folder-t">{y}</span>
            <span className="cx-folder-n">{(porAnio[y] || 0)} {(porAnio[y] || 0) === 1 ? "expediente" : "expedientes"}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------- thumbnail con carga diferida ---------- */
function Thumb({ id, onOpen }) {
  const [src, setSrc] = useState(null);
  useEffect(() => { let a = true; imgStore.get(id).then((s) => { if (a) setSrc(s); }); return () => { a = false; }; }, [id]);
  return <button className="cx-thumb" onClick={() => src && onOpen(src)}>{src ? <img src={src} alt="" /> : <span className="cx-thumbload">…</span>}</button>;
}

/* ---------- una hoja: foto + transcripción editable ---------- */
function HojaCard({ hoja, trabajando, onText, onRetrans, onDelete, onOpen }) {
  const [txt, setTxt] = useState(hoja.transcripcion || "");
  useEffect(() => { setTxt(hoja.transcripcion || ""); }, [hoja.transcripcion]);
  return (
    <div className="cx-hoja">
      <Thumb id={hoja.imgId} onOpen={onOpen} />
      <div className="cx-hojabody">
        {trabajando ? (
          <div className="cx-transload"><span className="cx-spin" /> Transcribiendo a texto…</div>
        ) : (
          <textarea className="cx-trans" value={txt} placeholder="Transcripción digital de la hoja…"
            onChange={(e) => setTxt(e.target.value)} onBlur={() => { if (txt !== hoja.transcripcion) onText(txt); }} />
        )}
        {hoja.error && !trabajando && <p className="cx-warnsm">No se pudo transcribir automáticamente (revisa tu conexión). Puedes escribir el texto a mano o reintentar.</p>}
        <div className="cx-hojaf">
          <button className="cx-link" disabled={trabajando} onClick={onRetrans}>{hoja.transcripcion ? "Transcribir de nuevo" : "Transcribir"}</button>
          <button className="cx-link danger" onClick={onDelete}>Eliminar hoja</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- EDITOR de un expediente ---------- */
function Editor({ ctx, expId }) {
  const { data, ir } = ctx;
  const exp = data.expedientes.find((e) => e.id === expId);
  const [trabajando, setTrabajando] = useState(() => new Set());
  const [modal, setModal] = useState(null);
  const [modo, setModo] = useState("manual");

  useEffect(() => { if (!exp) ir("lista"); }, [exp]);
  if (!exp) return null;

  const set = (k, v) => ctx.guardarExp({ ...exp, [k]: v });

  const transcribirHoja = async (hojaId, imgId) => {
    setTrabajando((s) => new Set(s).add(hojaId));
    try { const durl = await imgStore.get(imgId); const t = await transcribir(durl); ctx.actualizarHoja(expId, hojaId, { transcripcion: t, error: false }); }
    catch (e) { ctx.actualizarHoja(expId, hojaId, { error: true }); }
    finally { setTrabajando((s) => { const n = new Set(s); n.delete(hojaId); return n; }); }
  };
  const onFilesHojas = async (e) => {
    const files = Array.from(e.target.files || []); if (!files.length) return; e.target.value = "";
    for (const f of files) {
      const durl = await leerComprimir(f);
      const imgId = uid(), hojaId = uid();
      await imgStore.set(imgId, durl);
      ctx.upd((d) => { const ex = d.expedientes.find((x) => x.id === expId); if (ex) { ex.hojas = ex.hojas || []; ex.hojas.push({ id: hojaId, imgId, transcripcion: "", error: false }); } });
      await transcribirHoja(hojaId, imgId);
    }
  };
  const eliminarHoja = (hojaId, imgId) => { if (!confirm("¿Eliminar esta hoja?")) return; imgStore.del(imgId); ctx.upd((d) => { const ex = d.expedientes.find((x) => x.id === expId); if (ex) ex.hojas = ex.hojas.filter((h) => h.id !== hojaId); }); };

  const onFilesPaciente = async (e) => {
    const files = Array.from(e.target.files || []); if (!files.length) return; e.target.value = "";
    for (const f of files) {
      const durl = await leerComprimir(f);
      const imgId = uid(), fid = uid();
      await imgStore.set(imgId, durl);
      ctx.upd((d) => { const ex = d.expedientes.find((x) => x.id === expId); if (ex) { ex.fotosPaciente = ex.fotosPaciente || []; ex.fotosPaciente.push({ id: fid, imgId, descripcion: "" }); } });
    }
  };
  const eliminarFotoPac = (fid, imgId) => { if (!confirm("¿Eliminar esta foto?")) return; imgStore.del(imgId); ctx.upd((d) => { const ex = d.expedientes.find((x) => x.id === expId); if (ex) ex.fotosPaciente = ex.fotosPaciente.filter((h) => h.id !== fid); }); };

  const hojas = exp.hojas || [];
  const fotosPac = exp.fotosPaciente || [];
  const vacio = !(exp.nombre || "").trim() && hojas.length === 0 && fotosPac.length === 0 && !Object.values(exp.manual || {}).some((v) => (v || "").toString().trim());
  const salir = () => { if (vacio) ctx.borrarExp(expId); ir("lista"); };

  return (
    <div className="cx-page">
      <div className="cx-topbar2">
        <button className="cx-btn ghost" onClick={salir}>‹ Regresar</button>
        {vacio && <span className="cx-hintbar">Vacío — se descartará al regresar</span>}
      </div>

      <section className="cx-card">
        <div className="cx-grid2">
          <label className="cx-campo"><span className="cx-lbl">Nombre del paciente</span><input className="cx-in" value={exp.nombre} onChange={(e) => set("nombre", e.target.value)} placeholder="Nombre y apellidos" /></label>
          <label className="cx-campo"><span className="cx-lbl">Fecha del expediente</span><input type="date" className="cx-in" value={exp.fecha} max={hoyISO()} onChange={(e) => set("fecha", e.target.value)} /></label>
        </div>
        <p className="cx-meta">{exp.num} · creado {fmtFecha((exp.creadoEn || "").slice(0, 10))} · el nombre y la fecha sirven para archivar y buscar</p>
      </section>

      <div className="cx-modos">
        <button className={"cx-modo" + (modo === "manual" ? " on" : "")} onClick={() => setModo("manual")}><span>✍️</span>Manual (digital)</button>
        <button className={"cx-modo" + (modo === "foto" ? " on" : "")} onClick={() => setModo("foto")}><span>📷</span>Foto a mano → digital{hojas.length ? " (" + hojas.length + ")" : ""}</button>
        <button className={"cx-modo" + (modo === "fotosPac" ? " on" : "")} onClick={() => setModo("fotosPac")}><span>🩺</span>Fotos del paciente{fotosPac.length ? " (" + fotosPac.length + ")" : ""}</button>
      </div>

      {modo === "manual" && <ManualForm exp={exp} ctx={ctx} />}

      {modo === "foto" && (
        <section className="cx-card">
          <h2 className="cx-sec">Foto del expediente escrito a mano</h2>
          <p className="cx-note" style={{ marginTop: 0 }}>Sube o toma la foto de cada hoja escrita a mano. Se transcribe a texto digital automáticamente. <b>Revisa y corrige</b> la transcripción; la foto original siempre se conserva.</p>
          <label className="cx-upload">
            <input type="file" accept="image/*" multiple onChange={onFilesHojas} hidden />
            <span className="cx-upic">📷</span><span className="cx-upt">Subir foto del celular o tomar una</span><span className="cx-ups">Puedes elegir varias hojas</span>
          </label>
          {hojas.length === 0 ? <p className="cx-empty">Aún no hay hojas digitalizadas.</p> :
            <div className="cx-hojas">{hojas.map((h) => (
              <HojaCard key={h.id} hoja={h} trabajando={trabajando.has(h.id)}
                onText={(t) => ctx.actualizarHoja(expId, h.id, { transcripcion: t })}
                onRetrans={() => transcribirHoja(h.id, h.imgId)}
                onDelete={() => eliminarHoja(h.id, h.imgId)}
                onOpen={(s) => setModal(s)} />
            ))}</div>}
        </section>
      )}

      {modo === "fotosPac" && (
        <section className="cx-card">
          <h2 className="cx-sec">Fotos clínicas del paciente</h2>
          <p className="cx-note" style={{ marginTop: 0 }}>Sube o toma fotos del paciente (ojo, segmento, etc.). Se guardan como imágenes, <b>sin transcripción</b>.</p>
          <label className="cx-upload">
            <input type="file" accept="image/*" multiple onChange={onFilesPaciente} hidden />
            <span className="cx-upic">🩺</span><span className="cx-upt">Subir foto del celular o tomar una</span><span className="cx-ups">Puedes elegir varias</span>
          </label>
          {fotosPac.length === 0 ? <p className="cx-empty">Aún no hay fotos del paciente.</p> :
            <div className="cx-thumbgrid">{fotosPac.map((d) => (
              <div key={d.id} className="cx-thumbwrap">
                <Thumb id={d.imgId} onOpen={(s) => setModal(s)} />
                <input className="cx-thumbdesc" placeholder="Descripción…" defaultValue={d.descripcion} onBlur={(e) => ctx.upd((dd) => { const ex = dd.expedientes.find((x) => x.id === expId); const ph = ex && ex.fotosPaciente.find((x) => x.id === d.id); if (ph) ph.descripcion = e.target.value; })} />
                <button className="cx-thumbx" onClick={() => eliminarFotoPac(d.id, d.imgId)}>✕</button>
              </div>
            ))}</div>}
        </section>
      )}

      <div className="cx-formbar">
        <button className="cx-link danger" onClick={() => { if (confirm("¿Eliminar TODO este expediente? No se puede deshacer.")) { ctx.borrarExp(expId); ir("lista"); } }}>Eliminar expediente</button>
        <button className="cx-btn primary" onClick={salir}>Guardar y regresar</button>
      </div>

      {modal && <div className="cx-modal" onClick={() => setModal(null)}><img src={modal} alt="" /><button className="cx-modalx">✕ Cerrar</button></div>}
    </div>
  );
}

/* ---------- campo reutilizable de la nota manual ---------- */
function CampoNota({ label, k, area, f, set, commit, dis }) {
  return (
    <label className="cx-campo"><span className="cx-lbl">{label}</span>
      {area
        ? <textarea className="cx-in" rows={2} value={f[k] || ""} disabled={dis} onChange={(e) => set(k, e.target.value)} onBlur={commit} />
        : <input className="cx-in" value={f[k] || ""} disabled={dis} onChange={(e) => set(k, e.target.value)} onBlur={commit} />}
    </label>
  );
}

/* ---------- nota manual digital — réplica del expediente físico Kurí ---------- */
function ManualForm({ exp, ctx }) {
  const base = exp.manual || {};
  const firmado = !!base.firmadaEn;
  const [f, setF] = useState(base);
  useEffect(() => { setF(exp.manual || {}); }, [exp.id, base.firmadaEn]);
  const set = (k, v) => setF((o) => ({ ...o, [k]: v }));
  const commit = () => ctx.guardarExp({ ...exp, manual: f });
  const setNow = (patch) => { const next = { ...f, ...patch }; setF(next); ctx.guardarExp({ ...exp, manual: next }); };
  const firmar = () => { if (!confirm("Al firmar, la nota queda registrada con fecha y hora y ya no se edita (como indica la NOM-004). ¿Continuar?")) return; setNow({ firmadaEn: new Date().toISOString() }); };
  const dis = firmado;
  const props = { f, set, commit, dis };

  return (
    <section className="cx-card">
      <div className="cx-letter">
        <div className="cx-letter-top">
          <div className="cx-letter-logo">Kurí<small>INTEGRAL MÉDICA OCULAR</small></div>
          <div className="cx-letter-ced">Céd. Prof. {CED_PROF}<br />Consejo Mex. de Oft. {CONSEJO}<br />Céd. Esp. {CED_ESP}</div>
        </div>
        <div className="cx-letter-dr">{MEDICO}</div>
        <div className="cx-letter-sub">Cirujano Oftalmólogo · Microcirugía ocular, córnea y segmento anterior<br />Cirugía de: miopía, astigmatismo, cataratas y trasplante de córnea</div>
        <div className="cx-letter-id">Nombre: <b>{exp.nombre || "—"}</b> · Fecha: <b>{fmtFecha(exp.fecha)}</b> <span className="cx-hintbar">(se editan arriba)</span></div>
      </div>

      {firmado
        ? <div className="cx-firmado">✓ Nota firmada el {fmtFecha((base.firmadaEn || "").slice(0, 10))} por {MEDICO}. Para corregir, crea una nota nueva.</div>
        : <p className="cx-note" style={{ marginTop: 0 }}>Formato igual al expediente físico de Kurí. Captúralo y, al terminar, fírmalo para dejarlo en registro (NOM-004).</p>}

      <h3 className="cx-sec3">Ficha de identificación</h3>
      <div className="cx-grid2">
        <CampoNota label="Domicilio" k="domicilio" {...props} />
        <CampoNota label="Ciudad" k="ciudad" {...props} />
        <CampoNota label="Teléfono" k="tel" {...props} />
        <CampoNota label="Ocupación" k="ocupacion" {...props} />
        <CampoNota label="Edad (años)" k="edad" {...props} />
        <CampoNota label="Sexo" k="sexo" {...props} />
        <CampoNota label="Quién lo recomienda" k="recomienda" {...props} />
      </div>

      <h3 className="cx-sec3">Aviso de privacidad</h3>
      <p className="cx-note" style={{ marginTop: 0 }}>Consiente que sus datos personales sean tratados y, en su caso, transferidos conforme al aviso de privacidad (Ley Federal de Protección de Datos Personales en Posesión de los Particulares).</p>
      <div className="cx-consent">
        <span className="cx-lbl">Consentimiento:</span>
        <button className={"cx-cbtn" + (f.consent === "si" ? " on" : "")} disabled={dis} onClick={() => setNow({ consent: "si" })}>SÍ</button>
        <button className={"cx-cbtn" + (f.consent === "no" ? " on" : "")} disabled={dis} onClick={() => setNow({ consent: "no" })}>NO</button>
      </div>

      <h3 className="cx-sec3">Motivo de consulta (principales molestias)</h3>
      <CampoNota label="Motivo" k="motivo" area {...props} />

      <h3 className="cx-sec3">Interrogatorio</h3>
      <div className="cx-grid2">
        <CampoNota label="¿Usa lentes?" k="usaLentes" {...props} />
        <CampoNota label="¿Desde cuándo?" k="desdeCuando" {...props} />
        <CampoNota label="¿Cuándo fue la última graduación?" k="ultimaGrad" {...props} />
        <CampoNota label="¿Usa lentes de contacto?" k="usaLC" {...props} />
        <CampoNota label="¿Blandos o duros?" k="blandosDuros" {...props} />
        <CampoNota label="¿Desde cuándo (LC)?" k="lcDesde" {...props} />
        <CampoNota label="El último par, ¿qué tiempo tiene?" k="ultimoPar" {...props} />
        <CampoNota label="¿Cuántas horas los usa al día?" k="horasDia" {...props} />
        <CampoNota label="¿Con qué los desinfecta?" k="desinfecta" {...props} />
        <CampoNota label="¿Es diabético(a)?" k="diabetico" {...props} />
        <CampoNota label="¿Hace cuántos años?" k="diabAnios" {...props} />
        <CampoNota label="¿Con qué se trata?" k="diabTrata" {...props} />
        <CampoNota label="Fecha de última glucosa en sangre" k="glucosaFecha" {...props} />
        <CampoNota label="Resultados" k="glucosaResult" {...props} />
        <CampoNota label="¿Padece otra enfermedad importante?" k="otraEnf" {...props} />
        <CampoNota label="¿Cuál?" k="otraEnfCual" {...props} />
        <CampoNota label="¿Padece enfermedad de los ojos?" k="enfOjos" {...props} />
        <CampoNota label="¿Cuál o cuáles?" k="enfOjosCual" {...props} />
        <CampoNota label="¿Le han operado de los ojos?" k="operado" {...props} />
        <CampoNota label="¿De qué y en qué fecha?" k="operadoDet" {...props} />
        <CampoNota label="¿Le han puesto rayos láser?" k="laser" {...props} />
        <CampoNota label="¿Cuándo?" k="laserCuando" {...props} />
        <CampoNota label="¿En cuál ojo?" k="laserOjo" {...props} />
        <CampoNota label="¿Es alérgico a algo?" k="alergico" {...props} />
        <CampoNota label="¿A algún medicamento?" k="alergiaMed" {...props} />
        <CampoNota label="¿Está aplicándose gotas en los ojos?" k="gotas" {...props} />
        <CampoNota label="¿Cuáles?" k="gotasCuales" {...props} />
        <CampoNota label="¿Está tomando otro medicamento?" k="otroMed" {...props} />
        <CampoNota label="¿Cuál o cuáles?" k="otroMedCual" {...props} />
      </div>

      <h3 className="cx-sec3">Exploración oftalmológica — Agudeza visual (AV)</h3>
      <div className="cx-grid2">
        <CampoNota label="AV sin corrección (SC) — OD" k="avScOD" {...props} />
        <CampoNota label="AV sin corrección (SC) — OI" k="avScOI" {...props} />
        <CampoNota label="AV con corrección (CC) — OD" k="avCcOD" {...props} />
        <CampoNota label="AV con corrección (CC) — OI" k="avCcOI" {...props} />
        <CampoNota label="AV subjetivo — OD" k="avSubjOD" {...props} />
        <CampoNota label="AV subjetivo — OI" k="avSubjOI" {...props} />
      </div>
      <CampoNota label="Biomicroscopía" k="biomicroscopia" area {...props} />
      <div className="cx-grid4">
        <CampoNota label="TOA — OD" k="toaOD" {...props} />
        <CampoNota label="TOA — OI" k="toaOI" {...props} />
        <CampoNota label="Ciclopejía — OD" k="cicloOD" {...props} />
        <CampoNota label="Ciclopejía — OI" k="cicloOI" {...props} />
      </div>
      <div className="cx-grid2" style={{ marginTop: 13 }}>
        <CampoNota label="IDX (impresión diagnóstica)" k="idx" area {...props} />
        <CampoNota label="Plan" k="plan" area {...props} />
      </div>
      <CampoNota label="Cita" k="cita" {...props} />

      <div className="cx-firma">
        <div className="cx-firma-linea" />
        <div>{MEDICO}</div>
        <small>Céd. Prof. {CED_PROF} · Céd. Esp. {CED_ESP}</small>
      </div>

      {!firmado && <div className="cx-formbar"><span /><button className="cx-btn primary" onClick={firmar}>Firmar y registrar nota</button></div>}
    </section>
  );
}

.cx-thumbdesc{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.78rem;background:#fff;color:var(--ink)}
.cx-thumbx{position:absolute;top:6px;right:6px;background:rgba(20,30,45,.7);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:.8rem;line-height:1}
.cx-sec{font-size:1.05rem;margin-bottom:6px}
.cx-note{font-size:.82rem;color:var(--muted);line-height:1.5;margin:8px 0 14px}
.cx-upload{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px dashed var(--blue2);border-radius:14px;padding:24px;background:var(--blue-soft);cursor:pointer;text-align:center;transition:.15s;margin-bottom:8px}
.cx-upload:hover{background:#D7E6F7}
.cx-upic{font-size:1.7rem}
.cx-upt{font-weight:600;color:var(--blue)}
.cx-ups{font-size:.8rem;color:var(--muted)}
/* hojas */
.cx-hojas{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.cx-hoja{display:flex;gap:14px;border:1px solid var(--line);border-radius:13px;padding:12px;background:#FBFCFE}
.cx-thumb{width:120px;flex-shrink:0;aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#EFF2F6;padding:0}
.cx-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cx-thumbload{display:grid;place-items:center;height:100%;color:var(--muted)}
.cx-hojabody{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cx-trans{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:.9rem;line-height:1.55;background:#fff;color:var(--ink);resize:vertical}
.cx-trans:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 3px var(--blue-soft)}
.cx-transload{display:flex;align-items:center;gap:9px;color:var(--blue);font-size:.9rem;min-height:130px}
.cx-spin{width:16px;height:16px;border:2px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:cxspin .8s linear infinite}
@keyframes cxspin{to{transform:rotate(360deg)}}
.cx-warnsm{font-size:.8rem;color:var(--coral);margin:0}
.cx-hojaf{display:flex;gap:16px}
/* barra inferior */
.cx-formbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.cx-empty{color:var(--muted);text-align:center;padding:22px;font-size:.92rem}
/* modal */
.cx-modal{position:fixed;inset:0;background:rgba(15,25,40,.85);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.cx-modal img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.cx-modalx{background:#fff;color:var(--ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600}
@media(max-width:700px){
  .cx-grid2{grid-template-columns:1fr}
  .cx-grid4{grid-template-columns:1fr 1fr}
  .cx-modos{grid-template-columns:1fr}
  .cx-page{padding:18px 14px 70px}
  .cx-hoja{flex-direction:column}
  .cx-thumb{width:100%;aspect-ratio:16/10}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
